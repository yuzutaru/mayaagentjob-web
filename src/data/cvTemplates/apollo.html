<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Resume</title>
<style>
@page { size: A4; margin: 0; }
:root { --accent: #4F46E5; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; background: #fff; }
.page {
  width: 210mm; min-height: 297mm;
  padding: 15mm 17mm;
  font-family: 'Liberation Sans', Arial, Helvetica, sans-serif;
  font-size: 10.5pt; line-height: 1.5; color: #1F2937;
}
.name { font-size: 26pt; font-weight: 700; letter-spacing: -0.01em; color: #111827; }
.headline { font-size: 12.5pt; font-weight: 400; margin-top: 2px; color: var(--accent); }
.contact { font-size: 9.5pt; margin-top: 6px; color: #4B5563; }
.header-rule { border: 0; border-top: 2.4px solid var(--accent); margin: 10px 0 4px; width: 34mm; }
.block-title {
  font-size: 11pt; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--accent); margin: 16px 0 5px;
}
.summary p { margin-top: 3px; }
.skill-group { margin-bottom: 5px; }
.skill-cat { font-size: 10pt; font-weight: 700; text-transform: uppercase; color: #111827; }
.skill-list { margin-top: 1px; }
.exp-item { margin-bottom: 11px; border-left: 2px solid #E5E7EB; padding-left: 10px; }
.exp-head { display: flex; justify-content: space-between; align-items: baseline; }
.exp-role { font-size: 11.5pt; font-weight: 700; color: #111827; }
.exp-date { font-size: 9pt; color: #6B7280; white-space: nowrap; }
.exp-company { font-size: 10pt; margin-top: 1px; color: var(--accent); font-weight: 700; }
.exp-desc { margin-top: 3px; }
.exp-bullets { margin: 3px 0 0 16px; }
.edu-item { margin-bottom: 8px; }
.edu-degree { font-size: 11pt; font-weight: 700; color: #111827; }
.edu-meta { font-size: 9.5pt; color: #4B5563; }
.edu-desc { margin-top: 1px; }
.cert-list { margin: 3px 0 0 16px; }
</style>
</head>
<body>
<article class="page">
  <header>
    <h1 class="name">{{name}}</h1>
    <p class="headline">{{headline}}</p>
    {{contact}}
    <hr class="header-rule"/>
  </header>
  {{summary}}
  {{skills}}
  {{experience}}
  {{education}}
  {{certifications}}
</article>
</body>
</html>
